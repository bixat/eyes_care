name: Create Github Release
on:
  workflow_dispatch:

# Grant write permissions for release creation and asset uploading
permissions:
  contents: write

jobs:
  draft-release:
    name: Create Github release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Dart Language
        uses: dart-lang/setup-dart@v1
      - name: Get Project Version
        id: version
        run: |
          dart workflows_utils/get_project_version.dart
          echo "version_name=${version_name}" >> $GITHUB_OUTPUT
      - name: Draft release with release notes
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.version_name }}
          prerelease: false
          generate_release_notes: true

  create-build:
    name: Create ${{ matrix.target }} build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        target: [macOS, Windows, Linux]
        include:
          - os: macos-latest
            target: macOS
            build_target: macos
            build_path: build/macos/Build/Products/Release
            asset_extension: .dmg
            asset_content_type: application/vnd.appimage
          - os: windows-latest
            target: Windows
            build_target: windows
            build_path: build/windows/x64/runner/Release
            asset_extension: .zip
            asset_content_type: application/zip
          - os: ubuntu-latest
            target: Linux
            build_target: linux
            build_path: build/linux/x64/release/bundle
            asset_extension: .tar.gz
            asset_content_type: application/gzip

      # Disable fail-fast as we want results from all even if one fails.
      fail-fast: false
    needs: draft-release
    steps:
      # Set up Flutter.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2

      - name: Install Linux dependencies
        if: matrix.target == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config cmake ninja-build libblkid-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - run: flutter doctor -v
      # Checkout Taline code, recreate missing files, and get packages.
      - name: Checkout Taline code
        uses: actions/checkout@v4
      - run: flutter create .
      - run: flutter pub get
      - name: install linux requirements for local_notifier package
        if: matrix.target == 'Linux'
        run: sudo apt-get install libnotify-dev
      # Build the application.
      - run: flutter build -v ${{ matrix.build_target }} --release

      # Package the build.
      - name: Copy VC redistributables to release directory for Windows
        if: matrix.target == 'Windows'
        run: |
          Copy-Item (vswhere -latest -find 'VC\Redist\MSVC\*\x64\*\msvcp140.dll') .
          Copy-Item (vswhere -latest -find 'VC\Redist\MSVC\*\x64\*\vcruntime140.dll') .
          Copy-Item (vswhere -latest -find 'VC\Redist\MSVC\*\x64\*\vcruntime140_1.dll') .
        working-directory: ${{ matrix.build_path }}
      - name: Compress build for Linux
        if: matrix.target == 'Linux'
        run: tar czf $GITHUB_WORKSPACE/Taline${{ matrix.target }}.tar.gz *
        working-directory: ${{ matrix.build_path }}
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
      - name: Convert build to dmg for macOS
        if: matrix.target == 'macOS'
        run: npm install -g appdmg
      - name: run appdmg
        if: matrix.target == 'macOS'
        run: appdmg installer/dmg_creator/config.json $GITHUB_WORKSPACE/Taline${{ matrix.target }}.dmg
      - name: Compress build for Windows
        if: matrix.target == 'Windows'
        run: compress-archive -Path * -DestinationPath ${env:GITHUB_WORKSPACE}\Taline${{ matrix.target }}.zip
        working-directory: ${{ matrix.build_path }}

      # Upload the build.
      - name: Add packaged build to release draft
        id: upload_release_asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.draft-release.outputs.version_name }}
          files: ./Taline${{ matrix.target }}${{ matrix.asset_extension }}